services:
  api:
    build:
      context: ./apps/api
    container_name: adadd-api
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: adadd
      DB_PASSWORD: adadd_password
      DB_NAME: adadd
      # Development only. Production runs from compose.production.yml
      # (spec/operations.md#Production Configuration).
      # Explicit, so this file never depends on the "unset means development" default.
      APP_ENV: development
      # Required: the API refuses to start without it (see .env.example).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
      MIGRATE_ON_START: "true"
      MIGRATIONS_PATH: /app/migrations
      # # Google OAuth client ID, used to verify id_tokens on POST /auth/google.
      # # Sourced from a root .env file (gitignored) — see .env.example.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required, see .env.example}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
    # Published on this machine only, not to the network.
    ports:
      - "127.0.0.1:8080:8080"

  mysql:
    image: mysql:8.4
    container_name: adadd-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: adadd
      MYSQL_USER: adadd
      MYSQL_PASSWORD: adadd_password
      MYSQL_ROOT_PASSWORD: root_password

    # Published on this machine only, not to the network. The passwords above
    # are development values; production never uses them.
    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin

volumes:
  mysql-data:
