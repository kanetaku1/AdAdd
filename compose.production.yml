# AdAdd — production (spec/operations.md#Production Configuration, Issue #156)
#
# MySQL and the API only. Where the web app runs is decided with the hosting
# (spec/decisions/0002-deployment.md).
#
#   docker compose -f compose.production.yml --env-file .env.production up -d --build
#
# Every value comes from .env.production (gitignored; copy .env.production.example).
# Required values use ${VAR:?}, so a missing one stops `up` instead of starting
# with an empty value. Never reuse the development values in docker-compose.yml.

# Its own project: `docker compose down -v` in the development project never
# touches these containers or the production volume.
name: adadd-prod

services:
  api:
    build:
      context: ./apps/api
    container_name: adadd-prod-api
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      MIGRATIONS_PATH: /app/migrations
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}

    # This machine only. Never publish the API on every interface.
    ports:
      - "127.0.0.1:8080:8080"

  mysql:
    image: mysql:8.4
    container_name: adadd-prod-mysql
    restart: unless-stopped

    # Creates the database and its user on the first start only.
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    # No ports: only the API reaches MySQL, over the Compose network.

    volumes:
      - mysql-prod-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin

volumes:
  mysql-prod-data:
